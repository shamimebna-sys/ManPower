name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'platform/**'
      - '.github/workflows/ci.yml'
      - 'docs/database-audit/production-dump.sha256'
      - 'docs/database-audit/README.md'
  pull_request:
    branches: [main, develop]
    paths:
      - 'platform/**'
      - '.github/workflows/ci.yml'
      - 'docs/database-audit/production-dump.sha256'
      - 'docs/database-audit/README.md'
  workflow_dispatch:

defaults:
  run:
    working-directory: platform

env:
  NODE_ENV: test
  CORS_ORIGINS: http://localhost:3000
  LOG_LEVEL: info
  NEXT_PUBLIC_API_URL: http://localhost:4000

jobs:
  static:
    name: BUILD/STATIC — lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build API
        run: pnpm --filter api build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Build Web
        run: pnpm --filter web build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: https://api.example.com
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  unit:
    name: UNIT — API + web (no database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Unit tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          RUN_DB_TESTS: 'false'

  postgres16-integration:
    name: INTEGRATION — PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: manpower_ci
          POSTGRES_PASSWORD: manpower_ci_password
          POSTGRES_DB: manpower_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manpower_ci -d manpower_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://manpower_ci:manpower_ci_password@localhost:5432/manpower_ci
      RUN_DB_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
        working-directory: .
      - name: Verify recorded production dump SHA-256 evidence
        working-directory: .
        run: |
          EVIDENCE='docs/database-audit/production-dump.sha256'
          EXPECTED_HASH='D6B2C811CC456DD545AB3CF2578E6C45F713F89D262426F5C18FB5E5D660F2E8'
          EXPECTED_FILE='u410970153_eujobbd.sql'
          if [ ! -f "$EVIDENCE" ]; then
            echo "Missing committed dump SHA-256 evidence: $EVIDENCE"
            exit 1
          fi
          LINE=$(sed -n '1p' "$EVIDENCE" | tr -d '\r')
          echo "Recorded production dump SHA-256 evidence: $LINE"
          echo "This step verifies the committed evidence file only."
          echo "It does not hash production dump bytes (the SQL dump is intentionally not in Git)."
          test "$LINE" = "${EXPECTED_HASH}  ${EXPECTED_FILE}"
          grep -F -q "$EXPECTED_HASH" "$EVIDENCE"
          grep -F -q "$EXPECTED_FILE" "$EVIDENCE"
      - name: Fail unless SELECT version() is PostgreSQL 16
        env:
          PGPASSWORD: manpower_ci_password
        working-directory: .
        run: |
          VERSION=$(psql -h localhost -U manpower_ci -d manpower_ci -tAc "SELECT version();")
          echo "PostgreSQL version: $VERSION"
          echo "$VERSION" | grep -E 'PostgreSQL 16\.'
          echo "$VERSION" | grep -E 'PostgreSQL 1[78]' && exit 1 || true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm db:generate
      - name: Prisma migrate deploy (existing target migrations)
        run: pnpm --filter api db:migrate:deploy
      - name: Record applied migrations
        env:
          PGPASSWORD: manpower_ci_password
        working-directory: .
        run: psql -h localhost -U manpower_ci -d manpower_ci -c "SELECT migration_name, finished_at FROM _prisma_migrations ORDER BY finished_at;"
      - name: Integration + unit tests against PostgreSQL 16
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: https://api.example.com
